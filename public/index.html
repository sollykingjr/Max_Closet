<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Max's Closet">
<meta name="theme-color" content="#1D4F5E">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Max's Closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first ledger. Sticky header with counts, content list in the middle, fixed bottom tab bar. Rows are dense and scannable; brand headings carry the sizes that fit. */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#13202A; --muted:#5A6873; --line:#D5DCE1;
  --accent:#1D4F5E; --accent-ink:#FFFFFF; --wash:#E3EAEE;
  --ok:#1F6B45; --ok-bg:#DCEFE4; --warn:#7A5200; --warn-bg:#F8E8BE; --bad:#9C2F2A; --bad-bg:#F5DAD7; --info:#27567F; --info-bg:#DBE7F2;
  --font-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --font-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --font-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161B; --surface:#18222A; --ink:#E8EEF2; --muted:#93A3AF; --line:#2A3842;
  --accent:#6FB7C8; --accent-ink:#0B1A20; --wash:#1F2C35;
  --ok:#6FD0A0; --ok-bg:#17372A; --warn:#E8C46A; --warn-bg:#3A2F12; --bad:#F0968F; --bad-bg:#3E1E1C; --info:#8DB8E0; --info-bg:#1B2D3E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161B; --surface:#18222A; --ink:#E8EEF2; --muted:#93A3AF; --line:#2A3842;
  --accent:#6FB7C8; --accent-ink:#0B1A20; --wash:#1F2C35;
  --ok:#6FD0A0; --ok-bg:#17372A; --warn:#E8C46A; --warn-bg:#3A2F12; --bad:#F0968F; --bad-bg:#3E1E1C; --info:#8DB8E0; --info-bg:#1B2D3E;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 100px}
.wrap{max-width:720px;margin-inline:auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.05;margin:0;letter-spacing:-.01em}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-family:var(--font-data);font-size:12px;color:var(--muted)}
.counts b{color:var(--ink);font-weight:500}
main{padding-top:14px;display:flex;flex-direction:column;gap:14px}
[data-view]{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{font:400 15px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em;text-transform:uppercase}
label input,label select,label textarea{text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit}
.btn{font:600 14px var(--font-body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:13px;color:var(--muted)}
.group{display:flex;flex-direction:column}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 2px 6px;border-bottom:1px solid var(--line)}
.ghead h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:600}
.ghead span{font-family:var(--font-data);font-size:12px;color:var(--muted);text-align:right}
.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:11px 12px;color:var(--ink);cursor:pointer}
.row:first-of-type{border-top:0}
.row .main{min-width:0;display:flex;flex-direction:column;gap:2px}
.row .name{font-weight:500;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .comment{font-size:13px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pill{font:500 11px var(--font-data);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:3px 6px;white-space:nowrap}
.pill.closet{background:var(--info-bg);color:var(--info)}
.pill.approved{background:var(--ok-bg);color:var(--ok)}
.pill.try{background:var(--warn-bg);color:var(--warn)}
.pill.passed{background:var(--bad-bg);color:var(--bad)}
.pill.retired{background:var(--wash);color:var(--muted)}
.mono{font-family:var(--font-data);font-size:12px}
.maxp{font-family:var(--font-data);font-size:12px;color:var(--ink)}
.maxp.unset{color:var(--muted)}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--font-display);font-size:18px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-size:17px;margin-bottom:4px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-family:var(--font-display);font-size:16px}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.verdict .big{font-family:var(--font-display);font-weight:700;font-size:22px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:999px;font:600 13px var(--font-body);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sheet-back{position:fixed;inset:0;z-index:20;background:rgba(10,18,24,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:92%;overflow:auto;background:var(--bg);border-radius:14px 14px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.thinking{color:var(--muted);font-style:italic}
.err{color:var(--bad);font-size:13px}
.fab{align-self:flex-start}
.banner{margin:0;padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--wash);flex:none;border:1px solid var(--line)}
.thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;border-style:dashed}
.row .lead{display:flex;gap:10px;min-width:0;align-items:flex-start}
.stars{color:var(--warn);font-size:12px;letter-spacing:1px;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px}.flabel{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.03em;text-transform:uppercase}
.starpick{display:flex;gap:4px}
.starpick button{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:22px;line-height:1;padding:6px 10px;color:var(--muted);cursor:pointer}
.starpick button.on{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.pbox{width:96px;height:96px;border-radius:10px;border:1px dashed var(--line);background:var(--wash);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;flex:none;overflow:hidden}
.pbox img{width:100%;height:100%;object-fit:cover}
.photo-row{display:flex;gap:12px;align-items:center}
.filebtn{display:inline-block}
.stat{display:flex;gap:6px 18px;flex-wrap:wrap;font-family:var(--font-data);font-size:13px}
.stat b{font-weight:500}
.cpw{font-family:var(--font-data);font-size:12px;color:var(--ink)}
.sortbar{display:flex;gap:8px;align-items:center}
.sortbar select{width:auto}
.pickrow{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 12px;color:var(--ink);cursor:pointer}
.pickrow[aria-pressed="true"]{background:var(--info-bg)}
.pickrow .tick{font-family:var(--font-data);color:var(--accent)}
.hist{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.hist .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px}
.hist .main{min-width:0;display:flex;flex-direction:column;gap:2px}
.big2{font-family:var(--font-display);font-weight:700;font-size:22px}
.sheet-back.top2{z-index:30}
.hlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hlist .hist:last-child{border-bottom:0}

.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll::-webkit-scrollbar{display:none}
.scroll .chip{flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:560px){.grid3{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;min-width:0}
.timg{display:block;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--wash);border:1px solid var(--line);position:relative}
.timg img{width:100%;height:100%;object-fit:cover;display:block}
.timg .ttext{display:flex;align-items:center;justify-content:center;height:100%;padding:8px;text-align:center;font-size:12px;color:var(--muted);overflow:hidden}
.tname{font-size:12.5px;line-height:1.25;font-weight:500;overflow-wrap:anywhere}
.tmeta{font-size:11.5px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.tmeta .stars{font-size:11px;letter-spacing:0}
.tile .tick{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.tile[aria-pressed="true"] .timg{outline:3px solid var(--accent);outline-offset:-3px}
.tile[aria-pressed="true"] .tick{display:flex}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dockrow{max-width:720px;margin-inline:auto;display:flex;gap:8px;align-items:center}
.dockrow .btn{flex:1}
.dockrow input[type=date]{width:auto;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.otiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.otile{display:flex;flex-direction:column;gap:4px;font-size:11.5px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.morebody{display:flex;flex-direction:column;gap:12px;padding-top:12px}
details>summary{cursor:pointer;font:600 14px var(--font-body);color:var(--accent);padding:4px 0}
#sort-closet{width:auto;flex:none;max-width:46%}
.bar{flex-wrap:nowrap}
h1{font-size:22px}
header.top{padding-block:10px 6px}

/* Desktop: use the width, wrap the chips (mouse wheels cannot scroll sideways), center the modals */
@media (min-width:760px){
  body{padding-inline:32px}
  .wrap{max-width:1180px}
  h1{font-size:26px}
  .grid3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .scroll{flex-wrap:wrap;overflow:visible}
  .tabs{overflow:visible}
  [data-view="outfits"],[data-view="shop"],[data-view="stats"]{max-width:820px}
  .bar input[type=search]{max-width:420px}
  .sheet-back{align-items:center}
  .sheet{max-width:640px;max-height:90vh;border-radius:14px}
  .dockrow{max-width:1180px;justify-content:center}
  .dockrow .btn{flex:none;min-width:200px}
  .otiles{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
.qty{position:absolute;left:6px;bottom:6px;background:var(--ink);color:var(--bg);font:600 12px var(--font-data);padding:2px 7px;border-radius:999px}
</style>
</head><body>
<div class="wrap">
<header class="top">
  <h1>Max's Closet</h1>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="closet" aria-selected="true">Closet</button>
    <button class="tab" role="tab" data-tab="outfits" aria-selected="false">Outfits</button>
    <button class="tab" role="tab" data-tab="shop" aria-selected="false">Shop</button>
    <button class="tab" role="tab" data-tab="stats" aria-selected="false">Stats</button>
  </nav>
</header>
<main>
<p class="banner" id="banner" role="status" hidden></p>

<section data-view="closet" id="v-closet">
  <div class="bar"><input id="q-closet" type="search" placeholder="Search" aria-label="Search closet" style="flex:1">
    <select id="sort-closet" aria-label="Sort closet">
      <option value="cat">By category</option><option value="rating">Highest rated</option><option value="worn">Most worn</option>
      <option value="least">Least worn</option><option value="cpw">Lowest cost per wear</option><option value="paid">Most paid</option>
    </select></div>
  <div class="chips scroll" id="chips-closet" role="group" aria-label="Filter by category"></div>
  <div id="list-closet"></div>
</section>

<section data-view="outfits" id="v-outfits" hidden>
  <div class="panel">
    <div class="chips scroll" id="chips-mode" role="group" aria-label="Outfit style"></div>
    <div class="chips scroll" id="chips-occasion" role="group" aria-label="Occasion"></div>
    <input id="occasion" type="text" placeholder="Or describe it: dinner Saturday, mid-60s" aria-label="Describe the occasion">
    <div class="actions"><button class="btn" id="go-outfits" type="button">Suggest outfits</button><button class="btn ghost" id="stop-outfits" type="button" hidden>Stop</button></div>
    <details><summary>Build around one piece</summary><div class="morebody"><select id="anchor" aria-label="Build around"></select></div></details>
    <div id="out-outfits" aria-live="polite"></div>
  </div>
</section>

<section data-view="shop" id="v-shop" hidden>
  <div class="panel">
    <h2>Check a listing</h2>
    <label>Link, listing text or screenshot<textarea id="listing" placeholder="Paste the listing: Faherty Movement Shirt, size XL, $34, excellent condition" style="min-height:70px"></textarea></label>
    <label id="shot-wrap">Screenshot<input id="shot" type="file" accept="image/*"></label>
    <div class="actions"><button class="btn" id="go-check" type="button">Check this deal</button><button class="btn ghost" id="stop-check" type="button" hidden>Stop</button></div>
    <div id="out-check" aria-live="polite"></div>
    <details><summary>My rules</summary><div class="morebody"><textarea id="rules" aria-label="My rules" style="min-height:110px"></textarea><p class="note" style="margin:0">Saves on its own. Guides every check and outfit.</p></div></details>
  </div>
  <div class="ghead" style="padding-top:6px"><h2>Fit log</h2><span>styles you've tried</span></div>
  <div class="bar"><input id="q-log" type="search" placeholder="Search styles, brands, notes" aria-label="Search styles"></div>
  <div class="chips scroll" id="chips-log" role="group" aria-label="Filter by status"></div>
  <p class="note" id="log-help"></p>
  <div id="list-log"></div>
  <button class="btn ghost fab" id="add-style" type="button">+ Add a style</button>
</section>

<section data-view="stats" id="v-wears" hidden>
  <div id="wear-summary"></div>
  <button class="btn ghost fab" id="log-bulk" type="button">Add past wears for several pieces</button>
</section>
</main>
</div>

<div class="sheet-back" id="sheet-back" hidden>
  <form class="sheet" id="sheet" aria-labelledby="sheet-title">
    <h2 id="sheet-title">Edit piece</h2>
    <div class="photo-row">
      <div class="pbox" id="p-box">No photo</div>
      <div class="actions" style="flex-direction:column;align-items:flex-start">
        <label class="btn ghost filebtn" id="p-pick">Add photo<input id="f-photo" type="file" accept="image/*" hidden></label>
        <button type="button" class="btn ghost" id="p-paste">Paste photo</button>
        <button type="button" class="btn danger" id="p-remove" hidden>Remove photo</button>
      </div>
    </div>
    <div id="fill-box">
      <label>Fill from a link, listing text or screenshot<textarea id="fill-text" placeholder="Paste a product link or the listing text" style="min-height:60px"></textarea></label>
      <div class="actions" style="margin-top:8px"><button type="button" class="btn ghost" id="fill-go">Fill the fields</button><label class="btn ghost filebtn">Screenshot<input id="fill-shot" type="file" accept="image/*" hidden></label><span class="note" id="fill-msg"></span></div>
    </div>
    <div class="panel" id="wear-box" hidden>
      <div class="stat" id="wear-stats"></div>
      <div class="actions">
        <button type="button" class="btn ghost" id="wore-today">Wore it today</button>
        <input id="past-n" inputmode="numeric" placeholder="# past wears" aria-label="Number of past wears" style="width:130px">
        <button type="button" class="btn ghost" id="past-add">Add past wears</button>
      </div>
      <span class="note" id="wear-msg"></span>
    </div>
    <label>Name<input id="f-name" required></label>
    <div class="grid2">
      <label>Brand<input id="f-brand" list="brand-list"></label>
      <label>Price paid<input id="f-paid" inputmode="decimal" placeholder="$"></label>
    </div>
    <div class="field"><span class="flabel">How much I like it</span><div class="starpick" id="f-rating" role="group" aria-label="Rating"></div></div>
    <div class="grid2">
      <label>Size that fits<input id="f-size" placeholder="XL, 36x30, 11.5"></label>
      <label>Category<select id="f-cat"></select></label>
    </div>
    <label>How many do I own<input id="f-qty" inputmode="numeric" placeholder="1"></label>
    <div class="field"><span class="flabel">Where I wear it</span><div class="chips" id="f-uses" role="group" aria-label="Where I wear it"></div></div>
    <div class="field"><span class="flabel">How I wear it</span><div class="chips" id="f-uses2" role="group" aria-label="How I wear it"></div><span class="note">Shirts are assumed buttoned or as-is, never open, unless tagged.</span></div>
    <label>Description (used for outfits)<textarea id="f-look" placeholder="Filled in from the photo, or write your own" style="min-height:60px"></textarea></label>
    <div class="actions" style="margin-top:-6px"><button type="button" class="btn ghost" id="p-describe" hidden>Describe from photo</button><span class="note" id="describe-msg"></span></div>
    <div class="grid2">
      <label>Status<select id="f-status"></select></label>
      <label>Max price (secondhand)<input id="f-max" inputmode="decimal" placeholder="$"></label>
    </div>
    <div class="grid2">
      <label>Colors<input id="f-colors" placeholder="Navy, White"></label>
      <label>Type<input id="f-subs" placeholder="Oxford, Button Down"></label>
    </div>
    <label>Fabric<input id="f-fabric" placeholder="100% cotton oxford"></label>
    <label>Fit notes<textarea id="f-note" placeholder="Shoulders tight in XL, XXL too big"></textarea></label>
    <datalist id="brand-list"></datalist>
    <p class="err" id="sheet-err" role="alert"></p>
    <div class="actions">
      <button class="btn" type="submit" id="f-save">Save</button>
      <button class="btn ghost" type="button" id="f-cancel">Cancel</button>
      <span class="spacer"></span>
      <button class="btn danger" type="button" id="f-del" hidden>Delete</button>
    </div>
  </form>
</div>

<div class="sheet-back top2" id="sheet2-back" hidden>
  <form class="sheet" id="sheet2" aria-labelledby="sheet2-title">
    <h2 id="sheet2-title">Log an outfit</h2>
    <div class="grid2">
      <label id="w-date-wrap">Date<input id="w-date" type="date"></label>
      <label id="w-count-wrap" hidden>Wears each<input id="w-count" inputmode="numeric" placeholder="10"></label>
    </div>
    <label>Note<input id="w-note" placeholder="Optional"></label>
    <input id="w-q" type="search" placeholder="Search your closet" aria-label="Search closet">
    <div id="w-list" class="list" style="max-height:38vh;overflow:auto"></div>
    <p class="note" id="w-sel"></p>
    <p class="err" id="w-err" role="alert"></p>
    <div class="actions"><button class="btn" type="submit" id="w-save">Save</button><button class="btn ghost" type="button" id="w-cancel">Cancel</button></div>
  </form>
</div>

<div class="dock" id="dock">
  <div class="dockrow" id="dock-main"><button class="btn" id="dock-log" type="button">Log what I wore</button><button class="btn ghost" id="add-piece" type="button">+ Add piece</button></div>
  <div class="dockrow" id="dock-select" hidden><button class="btn ghost" id="sel-cancel" type="button" style="flex:none">Cancel</button><input type="date" id="sel-date" aria-label="Date worn"><button class="btn" id="sel-save" type="button">Log</button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
var STATUS={closet:"Closet",approved:"Approved",try:"To try",passed:"Passed",retired:"Retired"};
var USES_WHERE=["Work","Casual","Lounge","Dressy","Workout","Travel"];
var USES_HOW=["Undershirt only","Also undershirt","Can wear open"];
var CATS=["T-Shirts","Button Downs","Polos","Long Sleeves","Sweaters","Activewear","Pants","Shorts","Outerwear","Blazer","Shoes","Accessories","Bathing Suit","Socks"];
function catIdx(c){var i=CATS.indexOf(c);return i<0?99:i}
var OCC=["Work day","Casual weekend","Dinner out","Travel day","Cold, 40s","Hot, 85+"];
var state={selecting:false,sel:{},mode:"mix",fillShot:"",items:[],wears:[],ws:{},view:"closet",logFilter:"known",closetCat:"All",sort:"cat",loaded:false,rules:"",editing:null,occ:"",
  sheet:{id:null,rating:null,photo:null,removePhoto:false,look:""},w:{mode:"outfit",sel:{}}};
var $=function(id){return document.getElementById(id)};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(n){return (n==null||n==="")?"":"$"+(Math.round(n*100)/100).toString()}
function money2(n){return "$"+n.toFixed(2)}
function num(v){var n=parseFloat(String(v).replace(/[^0-9.]/g,""));return isFinite(n)?n:null}
function listOf(s){return String(s||"").split(",").map(function(x){return x.trim()}).filter(Boolean)}
function byBrandName(a,b){return (a.brand||"~").localeCompare(b.brand||"~")||a.name.localeCompare(b.name)}
function known(it){return it.status==="closet"||it.status==="approved"}
function matches(it,q){if(!q)return true;q=q.toLowerCase();return [it.name,it.brand,it.note,it.fabric,it.cat,it.look,(it.uses||[]).join(" "),(it.subs||[]).join(" "),(it.colors||[]).join(" ")].join(" ").toLowerCase().indexOf(q)>-1}
function pad(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function niceDate(s){var p=String(s||"").split("-");return p.length===3?MON[+p[1]-1]+" "+(+p[2])+(+p[0]!==new Date().getFullYear()?", "+p[0]:""):""}
function stars(n){return n?"★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n):""}
function label(i){return (i.brand?i.brand+" ":"")+i.name}
function itemById(id){return state.items.filter(function(i){return i.id===id})[0]}
function itemName(id){var i=itemById(id);return i?label(i):null}
function wearsOf(it){return (state.ws[it.id]&&state.ws[it.id].n)||0}
function qtyOf(it){return it.qty>1?it.qty:1}
function cpwOf(it){var n=wearsOf(it);return(it.paid>0&&n>0)?it.paid*qtyOf(it)/n:null}
function photoUrl(it,full){return "/api/photo/"+encodeURIComponent(it.id)+"?v="+it.photoV+(full?"&size=full":"")}

/* ---------- storage (Cloudflare D1 through /api) ---------- */
function setBanner(msg){var b=$("banner");b.hidden=!msg;b.textContent=msg||""}
function api(path,opts){
  opts=opts||{};
  var init={method:opts.method||"GET",headers:{}};
  if(opts.body!==undefined){init.headers["content-type"]="application/json";init.body=JSON.stringify(opts.body)}
  if(opts.signal)init.signal=opts.signal;
  return fetch(path,init).catch(function(e){
    if(e&&e.name==="AbortError")throw e;
    throw new Error("Could not reach the server. If you were signed out, reload the page to sign in again.");
  }).then(function(r){
    return r.text().then(function(t){
      var j=null;try{j=t?JSON.parse(t):null}catch(e){}
      if(!r.ok){var err=new Error((j&&j.error)||("HTTP "+r.status));err.status=r.status;throw err}
      if(j===null&&t&&/<html/i.test(t))throw new Error("Your sign-in expired. Reload the page to sign in again.");
      return j;
    });
  });
}
function recomputeWears(){
  var m={};
  state.wears.forEach(function(w){w.itemIds.forEach(function(id){
    var s=m[id]||(m[id]={n:0,last:""});s.n+=w.count;
    if(w.kind!=="bulk"&&w.date>s.last)s.last=w.date;
  })});
  state.ws=m;
}
function start(){
  render();
  api("/api/state").then(function(s){
    state.items=s.items||[];state.wears=s.wears||[];state.rules=s.rules||"";$("rules").value=state.rules;
    state.loaded=true;setBanner("");render();
  }).catch(function(e){
    state.loaded=true;state.dbMsg=(e&&e.message)||"Could not reach the server.";
    setBanner("Could not load your closet: "+state.dbMsg);render();
  });
}
var rulesTimer=null;
function saveRules(){
  state.rules=$("rules").value;
  clearTimeout(rulesTimer);
  rulesTimer=setTimeout(function(){api("/api/rules",{method:"PUT",body:{rules:state.rules}}).catch(function(){setBanner("Could not save your rules. Check your connection.")})},900);
}

/* ---------- rendering ---------- */
function render(){recomputeWears();renderLog();renderCloset();renderWears();renderAnchor();}
function chips(el,opts,cur,fn){
  el.innerHTML=opts.map(function(o){return '<button type="button" class="chip" data-v="'+esc(o[0])+'" aria-pressed="'+(o[0]===cur)+'">'+esc(o[1])+'</button>'}).join("");
  Array.prototype.forEach.call(el.querySelectorAll(".chip"),function(b){b.onclick=function(){fn(b.dataset.v)}});
}
function rowHtml(it,mode){
  var meta=[];if(it.brand)meta.push(esc(it.brand));if(mode==="log"&&it.cat)meta.push(esc(it.cat));
  if((it.colors||[]).length)meta.push(esc(it.colors.join(", ")));
  var side='<span class="side"><span class="pill '+esc(it.status)+'">'+esc(STATUS[it.status]||it.status)+'</span>';
  if(it.rating)side+='<span class="stars" aria-label="'+it.rating+' of 5">'+stars(it.rating)+'</span>';
  if(it.size)side+='<span class="mono">'+esc(it.size)+'</span>';
  if(mode==="closet"){
    var n=wearsOf(it),c=cpwOf(it);
    if(n)side+='<span class="cpw">'+n+'×'+(c!=null?' · '+money2(c)+'/wr':'')+'</span>';
  }else if(it.maxPrice!=null){side+='<span class="maxp">max '+esc(money(it.maxPrice))+'</span>'}
  else if(known(it)){side+='<span class="maxp unset">set max</span>'}
  side+='</span>';
  var thumb=it.photoV?'<img class="thumb" loading="lazy" alt="" src="'+photoUrl(it)+'">':(mode==="closet"?'<span class="thumb empty" aria-hidden="true">+</span>':'');
  return '<button type="button" class="row" data-id="'+esc(it.id)+'"><span class="lead">'+thumb+'<span class="main"><span class="name">'+esc(it.name)+'</span>'+(meta.length?'<span class="meta">'+meta.join(" · ")+'</span>':'')+(it.note&&mode==="log"?'<span class="comment">'+esc(it.note)+'</span>':'')+'</span></span>'+side+'</button>';
}
function bindRows(el){Array.prototype.forEach.call(el.querySelectorAll(".row"),function(b){b.onclick=function(){openSheet(b.dataset.id)}})}
function emptyBox(title,text){return '<div class="empty"><b>'+esc(title)+'</b>'+esc(text)+'</div>'}

function renderLog(){
  chips($("chips-log"),[["known","Known fit"],["try","To try"],["passed","Passed"],["retired","Retired"],["all","All"]],state.logFilter,function(v){state.logFilter=v;renderLog()});
  var help={known:"Every style you own or approved, with sizes. These are safe to buy secondhand in the sizes shown.",try:"Styles to try on in person before buying secondhand.",passed:"Styles that did not work. Check these notes before a listing tempts you.",retired:"Pieces you no longer wear.",all:"Everything you have evaluated, owned or not."};
  $("log-help").textContent=help[state.logFilter]||"";
  var q=$("q-log").value.trim();
  var items=state.items.filter(function(i){
    var f=state.logFilter;
    return (f==="all"||(f==="known"?known(i):i.status===f))&&matches(i,q);
  }).sort(byBrandName);
  var el=$("list-log");
  if(!state.loaded){el.innerHTML=emptyBox("Loading your closet","One moment.");return}
  if(!state.items.length){el.innerHTML=state.dbMsg?emptyBox("No data to show",state.dbMsg):emptyBox("No styles yet","Add one with the button below, or paste a listing in Deal check.");return}
  if(!items.length){el.innerHTML=emptyBox("Nothing here","No styles match this filter.");return}
  var groups={},order=[];
  items.forEach(function(i){var b=i.brand||"Other";if(!groups[b]){groups[b]=[];order.push(b)}groups[b].push(i)});
  el.innerHTML=order.map(function(b){
    var sizes={};groups[b].forEach(function(i){if(i.size&&known(i))sizes[i.size]=(sizes[i.size]||0)+1});
    var sz=Object.keys(sizes).sort(function(a,c){return sizes[c]-sizes[a]}).slice(0,4).join(" · ");
    return '<div class="group"><div class="ghead"><h2>'+esc(b)+'</h2><span>'+groups[b].length+(sz?' · fits '+esc(sz):'')+'</span></div><div class="list">'+groups[b].map(function(i){return rowHtml(i,"log")}).join("")+'</div></div>';
  }).join("");
  bindRows(el);
}

function sortItems(items,mode){
  var cmp={
    cat:function(a,b){return catIdx(a.cat)-catIdx(b.cat)||(a.subs&&a.subs[0]||"").localeCompare(b.subs&&b.subs[0]||"")||a.name.localeCompare(b.name)},
    rating:function(a,b){return (b.rating||0)-(a.rating||0)||byBrandName(a,b)},
    worn:function(a,b){return wearsOf(b)-wearsOf(a)||byBrandName(a,b)},
    least:function(a,b){return wearsOf(a)-wearsOf(b)||byBrandName(a,b)},
    cpw:function(a,b){var x=cpwOf(a),y=cpwOf(b);return (x==null?1e9:x)-(y==null?1e9:y)||byBrandName(a,b)},
    paid:function(a,b){return (b.paid||0)-(a.paid||0)||byBrandName(a,b)}
  }[mode]||byBrandName;
  return items.sort(cmp);
}
function tileHtml(it){
  var on=!!state.sel[it.id];
  var img=it.photoV?'<img loading="lazy" alt="" src="'+photoUrl(it)+'">':'<span class="ttext">No photo</span>';
  var meta=[];if(it.brand)meta.push(esc(it.brand));
  if(it.rating)meta.push('<span class="stars">'+stars(it.rating).slice(0,it.rating)+'</span>');
  if(wearsOf(it)&&state.sort==="worn")meta.push(wearsOf(it)+"×");
  return '<button type="button" class="tile" data-id="'+esc(it.id)+'" aria-pressed="'+on+'"><span class="timg">'+img+'<span class="tick" aria-hidden="true">✓</span>'+(qtyOf(it)>1?'<span class="qty">×'+qtyOf(it)+'</span>':'')+'</span>'+
    '<span class="tmeta">'+meta.join(" · ")+'</span><span class="tname">'+esc(it.name)+'</span></button>';
}
function bindTiles(el){Array.prototype.forEach.call(el.querySelectorAll(".tile"),function(b){b.onclick=function(){
  var id=b.dataset.id;
  if(state.selecting){if(state.sel[id])delete state.sel[id];else state.sel[id]=1;b.setAttribute("aria-pressed",String(!!state.sel[id]));updateDock()}
  else openSheet(id);
}})}
function renderCloset(){
  var closet=state.items.filter(function(i){return i.status==="closet"});
  var cats=["All"].concat(CATS.filter(function(c){return closet.some(function(i){return i.cat===c})}));
  if(closet.some(function(i){return !i.cat}))cats.push("Other");
  chips($("chips-closet"),cats.map(function(c){return [c,c]}),state.closetCat,function(v){state.closetCat=v;renderCloset()});
  var q=$("q-closet").value.trim();
  var items=closet.filter(function(i){
    var c=state.closetCat;
    return (c==="All"||(c==="Other"?!i.cat:i.cat===c))&&matches(i,q);
  });
  var el=$("list-closet");
  if(!state.loaded){el.innerHTML=emptyBox("Loading your closet","One moment.");return}
  if(!closet.length){el.innerHTML=state.dbMsg?emptyBox("No data to show",state.dbMsg):emptyBox("Your closet is empty","Tap + Add piece to start.");return}
  if(!items.length){el.innerHTML=emptyBox("Nothing here","No pieces match.");return}
  sortItems(items,state.sort);
  if(state.sort!=="cat"||state.closetCat!=="All"){
    el.innerHTML='<div class="grid3">'+items.map(tileHtml).join("")+'</div>';bindTiles(el);return;
  }
  var groups={},order=[];
  items.forEach(function(i){var k=i.cat||"Other";if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(i)});
  el.innerHTML=order.map(function(k){
    return '<div class="group"><div class="ghead"><h2>'+esc(k)+'</h2><span>'+groups[k].length+'</span></div><div class="grid3" style="padding-top:10px">'+groups[k].map(tileHtml).join("")+'</div></div>';
  }).join("");
  bindTiles(el);
}

/* ---------- log what I wore (select mode on the closet grid) ---------- */
function toast(msg,long){var el=$("toast");el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){el.hidden=true},long?9000:2600)}
function updateDock(){
  $("dock").hidden=state.view!=="closet";
  $("dock-main").hidden=state.selecting;$("dock-select").hidden=!state.selecting;
  var n=Object.keys(state.sel).length;
  $("sel-save").textContent=n?"Log "+n+(n===1?" piece":" pieces"):"Pick what you wore";
  $("sel-save").disabled=!n;
}
function startSelect(){state.selecting=true;state.sel={};$("sel-date").value=today();renderCloset();updateDock()}
function endSelect(){state.selecting=false;state.sel={};renderCloset();updateDock()}
function saveSelect(){
  var ids=Object.keys(state.sel);if(!ids.length)return;
  $("sel-save").disabled=true;
  addWear({itemIds:ids,kind:"outfit",date:$("sel-date").value||today(),count:1}).then(function(){
    toast("Logged "+ids.length+(ids.length===1?" piece":" pieces")+" for "+niceDate($("sel-date").value||today()));endSelect();
  }).catch(function(e){toast("Could not save: "+((e&&e.message)||"error"),true);$("sel-save").disabled=false});
}

function renderAnchor(){
  var sel=$("anchor"),cur=sel.value;
  var closet=state.items.filter(function(i){return i.status==="closet"}).sort(byBrandName);
  sel.innerHTML='<option value="">Nothing in particular</option>'+closet.map(function(i){return '<option value="'+esc(i.id)+'">'+esc(label(i))+'</option>'}).join("");
  sel.value=cur;
  chips($("chips-mode"),[["mix","Mix it up"],["favorites","Favorites"],["while","Been a while"]],state.mode,function(v){state.mode=v;renderAnchor()});
  chips($("chips-occasion"),OCC.map(function(o){return [o,o]}),state.occ,function(v){state.occ=(state.occ===v?"":v);$("occasion").value=state.occ;renderAnchor()});
}

/* ---------- wears tab ---------- */
var showAllCpw=false;
function renderWears(){
  var el=$("wear-summary");
  if(!state.loaded){el.innerHTML="";return}
  var owned=state.items.filter(function(i){return i.status==="closet"});
  var worn=owned.filter(function(i){return wearsOf(i)>0}),never=owned.filter(function(i){return wearsOf(i)===0});
  var total=0;state.wears.forEach(function(w){total+=w.count*w.itemIds.length});
  var spent=0,spentWorn=0;owned.forEach(function(i){if(i.paid>0){spent+=i.paid*qtyOf(i);if(wearsOf(i)>0)spentWorn+=i.paid*qtyOf(i)}});
  var html='<p class="note" style="margin:0">'+worn.length+' pieces worn · '+never.length+' never worn'+(spent?' · '+esc(money2(spent))+' paid for what you own':'')+'</p>';
  var ranked=owned.filter(function(i){return cpwOf(i)!=null}).sort(function(a,b){return cpwOf(a)-cpwOf(b)});
  if(ranked.length){
    var shown=showAllCpw?ranked:ranked.slice(0,10);
    html+='<div class="group"><div class="ghead"><h2>Cost per wear</h2><span>lowest first</span></div><div class="list">'+shown.map(function(i){return rowHtml(i,"closet")}).join("")+'</div>'+
      (ranked.length>10?'<button type="button" class="btn ghost fab" id="cpw-toggle" style="margin-top:8px">'+(showAllCpw?'Show top 10':'Show all '+ranked.length)+'</button>':'')+'</div>';
  }
  if(never.length){
    html+='<div class="group"><div class="ghead"><h2>Never worn</h2><span>'+never.length+' pieces</span></div><div class="list">'+never.sort(byBrandName).slice(0,25).map(function(i){return rowHtml(i,"closet")}).join("")+'</div>'+(never.length>25?'<p class="note">Showing 25 of '+never.length+'. Use "Add past wears" to log what you already wear.</p>':'')+'</div>';
  }
  if(state.wears.length){
    html+='<div class="group"><div class="ghead"><h2>History</h2><span>'+state.wears.length+' entries</span></div><div class="hlist">'+state.wears.slice(0,40).map(function(w){
      var names=w.itemIds.map(itemName).filter(Boolean);
      var title=w.kind==="bulk"?(w.count+' wears each · '+niceDate(w.date)):niceDate(w.date)+(w.count>1?' · '+w.count+'×':'');
      return '<div class="hist"><span class="main"><span class="name">'+esc(title)+(w.kind==="bulk"?' <span class="pill retired">past</span>':'')+'</span><span class="meta">'+esc(names.join(", "))+'</span>'+(w.note?'<span class="comment">'+esc(w.note)+'</span>':'')+'</span><button type="button" class="x" data-del="'+esc(w.id)+'" aria-label="Delete this entry">×</button></div>';
    }).join("")+'</div></div>';
  }
  if(!state.wears.length)html+=emptyBox("No wears yet","Log an outfit, or add past wears to estimate what each piece has cost per wear.");
  el.innerHTML=html;
  bindRows(el);
  var t=$("cpw-toggle");if(t)t.onclick=function(){showAllCpw=!showAllCpw;renderWears()};
  Array.prototype.forEach.call(el.querySelectorAll("[data-del]"),function(b){b.onclick=function(){
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Delete?";b.style.color="var(--bad)";return}
    api("/api/wears/"+encodeURIComponent(b.dataset.del),{method:"DELETE"}).then(function(){
      state.wears=state.wears.filter(function(w){return w.id!==b.dataset.del});render();refreshSheetStats();
    }).catch(function(){setBanner("Could not delete that entry.")});
  }});
}
function addWear(entry){
  return api("/api/wears",{method:"POST",body:entry}).then(function(w){
    state.wears.unshift(w);state.wears.sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});render();refreshSheetStats();return w;
  });
}

/* ---------- wear picker sheet ---------- */
function openPicker(mode){
  state.w={mode:mode,sel:{}};
  $("sheet2-title").textContent=mode==="bulk"?"Add past wears":"Log an outfit";
  $("w-date-wrap").hidden=mode==="bulk";$("w-count-wrap").hidden=mode!=="bulk";
  $("w-date").value=today();$("w-count").value="";$("w-note").value=mode==="bulk"?"":"";
  $("w-note").placeholder=mode==="bulk"?"e.g. estimate before I started tracking":"Optional";
  $("w-q").value="";$("w-err").textContent="";
  renderPicker();$("sheet2-back").hidden=false;
}
function renderPicker(){
  var q=$("w-q").value.trim();
  var items=state.items.filter(function(i){return i.status==="closet"&&(matches(i,q)||state.w.sel[i.id])}).sort(function(a,b){return (a.cat||"~").localeCompare(b.cat||"~")||byBrandName(a,b)});
  $("w-list").innerHTML=items.length?items.map(function(i){
    var on=!!state.w.sel[i.id];
    return '<button type="button" class="pickrow" data-id="'+esc(i.id)+'" aria-pressed="'+on+'"><span class="main"><span class="name">'+esc(label(i))+'</span><span class="meta">'+esc([i.cat,(i.colors||[]).join(", ")].filter(Boolean).join(" · "))+'</span></span><span class="tick">'+(on?"✓":"")+'</span></button>';
  }).join(""):'<div class="empty">No pieces match.</div>';
  Array.prototype.forEach.call($("w-list").querySelectorAll(".pickrow"),function(b){b.onclick=function(){
    if(state.w.sel[b.dataset.id])delete state.w.sel[b.dataset.id];else state.w.sel[b.dataset.id]=1;
    var sc=$("w-list").scrollTop;renderPicker();$("w-list").scrollTop=sc;
  }});
  var n=Object.keys(state.w.sel).length;$("w-sel").textContent=n?n+(n===1?" piece":" pieces")+" selected":"Tap pieces to select them.";
}
function savePicker(ev){
  ev.preventDefault();
  var ids=Object.keys(state.w.sel);
  if(!ids.length){$("w-err").textContent="Pick at least one piece.";return}
  var entry={itemIds:ids,note:$("w-note").value.trim(),kind:state.w.mode==="bulk"?"bulk":"outfit",date:$("w-date").value||today(),count:1};
  if(entry.kind==="bulk"){
    var c=parseInt($("w-count").value,10);
    if(!(c>0)){$("w-err").textContent="Enter how many times you wore each piece.";return}
    entry.count=c;entry.date=today();
  }
  $("w-save").disabled=true;
  addWear(entry).then(function(){$("sheet2-back").hidden=true}).catch(function(e){$("w-err").textContent="Could not save ("+((e&&e.message)||"error")+")."}).then(function(){$("w-save").disabled=false});
}

/* ---------- item sheet (add / edit / detail) ---------- */
function fillSelect(sel,opts){sel.innerHTML=opts.map(function(o){return '<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>'}).join("")}
function renderUsesPick(){
  [["f-uses",USES_WHERE],["f-uses2",USES_HOW]].forEach(function(g){
    var el=$(g[0]);
    el.innerHTML=g[1].map(function(u){return '<button type="button" class="chip" data-u="'+esc(u)+'" aria-pressed="'+(state.sheet.uses.indexOf(u)>-1)+'">'+esc(u)+'</button>'}).join("");
    Array.prototype.forEach.call(el.querySelectorAll(".chip"),function(b){b.onclick=function(){
      var i=state.sheet.uses.indexOf(b.dataset.u);if(i>-1)state.sheet.uses.splice(i,1);else state.sheet.uses.push(b.dataset.u);renderUsesPick();
    }});
  });
}
function renderRatingPick(){
  var el=$("f-rating");
  el.innerHTML=[1,2,3,4,5].map(function(n){return '<button type="button" data-n="'+n+'" class="'+(state.sheet.rating>=n?"on":"")+'" aria-label="'+n+' star'+(n>1?"s":"")+'">★</button>'}).join("");
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){b.onclick=function(){var n=+b.dataset.n;state.sheet.rating=(state.sheet.rating===n?null:n);renderRatingPick()}});
}
function renderPhotoBox(){
  var s=state.sheet,it=s.id&&itemById(s.id),box=$("p-box");
  var src=s.photo?s.photo.thumb:(!s.removePhoto&&it&&it.photoV?photoUrl(it,true):"");
  box.innerHTML=src?'<img alt="Photo" src="'+src+'">':"No photo";
  $("p-remove").hidden=!src;
  $("p-pick").firstChild.nodeValue=src?"Change photo":"Add photo";
  $("p-describe").hidden=!(it&&it.photoV&&!s.photo&&!s.removePhoto);
}
function refreshSheetStats(){
  if($("sheet-back").hidden||!state.editing)return;
  var it=itemById(state.editing);if(!it)return;
  var n=wearsOf(it),c=cpwOf(it),last=state.ws[it.id]&&state.ws[it.id].last;
  var paidNow=num($("f-paid").value);
  var qn=parseInt($("f-qty").value,10)||1;var cp=(paidNow>0&&n>0)?paidNow*qn/n:null;
  $("wear-stats").innerHTML='<span><b>'+n+'</b> '+(n===1?"wear":"wears")+'</span><span><b>'+(cp!=null?money2(cp):"—")+'</b> per wear</span>'+(last?'<span>last worn <b>'+esc(niceDate(last))+'</b></span>':'');
}
function openSheet(id,preset){
  var it=id?itemById(id):null;
  if(id&&!it)return;
  state.editing=it?it.id:null;
  var d=it||preset||{status:"try"};
  state.sheet={id:it?it.id:newId(),rating:d.rating||null,uses:(d.uses||[]).map(function(u){return u==="Layer only"?"Undershirt only":u}).slice(),photo:null,removePhoto:false};
  $("sheet-title").textContent=it?(it.status==="closet"?"Edit piece":"Edit style"):(d.status==="closet"?"Add a piece":"Add a style");
  fillSelect($("f-cat"),[["","Choose"]].concat(CATS.map(function(c){return [c,c]})));
  fillSelect($("f-status"),Object.keys(STATUS).map(function(k){return [k,STATUS[k]]}));
  var brands={};state.items.forEach(function(i){if(i.brand)brands[i.brand]=1});
  $("brand-list").innerHTML=Object.keys(brands).sort().map(function(b){return '<option value="'+esc(b)+'">'}).join("");
  $("f-name").value=d.name||"";$("f-brand").value=d.brand||"";$("f-cat").value=d.cat||"";$("f-status").value=d.status||"try";
  $("f-size").value=d.size||"";$("f-max").value=d.maxPrice!=null?d.maxPrice:"";$("f-paid").value=d.paid!=null?d.paid:"";
  $("f-colors").value=(d.colors||[]).join(", ");$("f-subs").value=(d.subs||[]).join(", ");$("f-fabric").value=d.fabric||"";$("f-note").value=d.note||"";
  $("f-look").value=d.look||"";$("f-qty").value=d.qty>1?d.qty:"";
  $("f-del").hidden=!it;$("f-del").textContent="Delete";$("f-del").dataset.armed="";
  $("sheet-err").textContent="";$("fill-msg").textContent="";$("fill-text").value="";$("describe-msg").textContent="";$("wear-msg").textContent="";$("past-n").value="";
  state.fillShot="";$("fill-box").hidden=!!it;
  $("wear-box").hidden=!it;
  renderRatingPick();renderUsesPick();renderPhotoBox();
  $("sheet-back").hidden=false;refreshSheetStats();
  if(!it)setTimeout(function(){$("f-name").focus()},30);
}
function closeSheet(){$("sheet-back").hidden=true;state.editing=null}
function readSheet(){
  var d={name:$("f-name").value.trim(),brand:$("f-brand").value.trim(),cat:$("f-cat").value,status:$("f-status").value,
    size:$("f-size").value.trim(),colors:listOf($("f-colors").value),subs:listOf($("f-subs").value),fabric:$("f-fabric").value.trim(),note:$("f-note").value.trim(),
    look:$("f-look").value.trim(),rating:state.sheet.rating,qty:parseInt($("f-qty").value,10)||1,uses:state.sheet.uses.slice()};
  var mx=num($("f-max").value),pd=num($("f-paid").value);
  if(mx!=null)d.maxPrice=mx;if(pd!=null)d.paid=pd;
  var cur=state.editing&&itemById(state.editing);if(cur&&cur.url)d.url=cur.url;
  return d;
}
function newId(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function upsertLocal(saved){
  var found=false;
  state.items=state.items.map(function(i){if(i.id===saved.id){found=true;return saved}return i});
  if(!found)state.items.push(saved);
}
function saveSheet(ev){
  ev.preventDefault();
  var d=readSheet();
  if(!d.name){$("sheet-err").textContent="Give it a name.";return}
  var id=state.sheet.id,s=state.sheet,isNew=!state.editing;
  $("f-save").disabled=true;
  api("/api/items/"+encodeURIComponent(id),{method:"PUT",body:d}).then(function(saved){
    upsertLocal(saved);
    var p=Promise.resolve();
    if(s.photo)p=api("/api/photo/"+encodeURIComponent(id),{method:"PUT",body:s.photo}).then(function(r){saved.photoV=r.photoV;upsertLocal(saved);return "photo"});
    else if(s.removePhoto&&saved.photoV)p=api("/api/photo/"+encodeURIComponent(id),{method:"DELETE"}).then(function(){saved.photoV=null;saved.look=saved.look;upsertLocal(saved)});
    return p.then(function(did){
      render();closeSheet();
      if(did==="photo")describePhoto(id,true);
    });
  }).catch(function(e){$("sheet-err").textContent="Could not save ("+((e&&e.message)||"error")+"). Try again."}).then(function(){$("f-save").disabled=false});
}
function describePhoto(id,quiet){
  var msg=quiet?null:$("describe-msg");
  if(msg)msg.textContent="Looking at the photo...";
  return api("/api/ai",{method:"POST",body:{task:"describe",itemId:id}}).then(function(r){
    var it=itemById(id);if(it){it.look=r.look;render()}
    if(state.editing===id&&!$("sheet-back").hidden){$("f-look").value=r.look;if(msg)msg.textContent="Described."}
  }).catch(function(e){if(msg)msg.textContent=errCopy(e)||"";else setBanner("Saved, but the photo could not be described: "+errCopy(e)+" Open the piece and tap Describe from photo to retry.")});
}
function deleteSheet(){
  var b=$("f-del");
  if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to delete";return}
  if(!state.editing)return;
  var did=state.editing;
  api("/api/items/"+encodeURIComponent(did),{method:"DELETE"}).then(function(){
    state.items=state.items.filter(function(i){return i.id!==did});
    state.wears=state.wears.map(function(w){w.itemIds=w.itemIds.filter(function(x){return x!==did});return w}).filter(function(w){return w.itemIds.length});
    render();closeSheet();
  }).catch(function(){$("sheet-err").textContent="Could not delete. Try again."});
}
function resizeTo(file,max,q){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",q));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Could not read that image."))};
    img.src=url;
  });
}
function readImage(file){return resizeTo(file,1400,0.82)}
function pickPhoto(file){
  if(!file)return Promise.resolve();
  return Promise.all([resizeTo(file,256,0.78),resizeTo(file,900,0.8)]).then(function(r){
    state.sheet.photo={thumb:r[0],full:r[1]};state.sheet.removePhoto=false;renderPhotoBox();
  }).catch(function(e){$("sheet-err").textContent=(e&&e.message)||"Could not read that image."});
}

/* ---------- AI (runs on the Worker, so the API key never reaches the phone) ---------- */
function errCopy(e){
  if(e&&e.name==="AbortError")return "";
  if(e&&e.message)return e.message;
  return "Something went wrong. Try again.";
}
var outCtl=null,chkCtl=null;
function suggestOutfits(){
  if(!state.items.some(function(i){return i.status==="closet"})){$("out-outfits").innerHTML=emptyBox("Closet is empty","Add pieces first.");return}
  outCtl=new AbortController();
  $("go-outfits").disabled=true;$("stop-outfits").hidden=false;
  $("out-outfits").innerHTML='<p class="thinking">Thinking...</p>';
  api("/api/ai",{method:"POST",signal:outCtl.signal,body:{task:"outfits",mode:state.mode,today:today(),occasion:$("occasion").value.trim(),anchor:$("anchor").value}}).then(function(r){
    var list=r&&r.outfits;
    if(!Array.isArray(list)||!list.length)throw new Error("No outfits came back. Try again.");
    $("out-outfits").innerHTML='<div class="cards">'+list.slice(0,3).map(function(o,idx){
      var names=(o.pieceIds||[]).map(itemName).filter(Boolean);
      return '<div class="card">'+(o.label?'<span class="pill closet" style="align-self:flex-start">'+esc(o.label)+'</span>':'')+'<h3>'+esc(o.title||"Outfit")+'</h3><div class="otiles">'+(o.pieceIds||[]).map(itemById).filter(Boolean).map(function(it){return '<span class="otile"><span class="timg">'+(it.photoV?'<img alt="" src="'+photoUrl(it)+'">':'<span class="ttext">'+esc(label(it))+'</span>')+'</span>'+(it.photoV?esc(label(it)):'')+'</span>'}).join("")+'</div>'+(o.why?'<span class="note">'+esc(o.why)+'</span>':'')+
        '<div class="actions"><button type="button" class="btn ghost wore" data-i="'+idx+'">I wore this today</button></div></div>';
    }).join("")+'</div>';
    Array.prototype.forEach.call($("out-outfits").querySelectorAll(".wore"),function(b){b.onclick=function(){
      var o=list[+b.dataset.i];b.disabled=true;b.textContent="Logging...";
      addWear({itemIds:o.pieceIds||[],kind:"outfit",date:today(),count:1,note:o.title||""}).then(function(){b.textContent="Logged ✓"}).catch(function(){b.disabled=false;b.textContent="Could not log. Retry"});
    }});
  }).catch(function(e){var m=errCopy(e);$("out-outfits").innerHTML=m?'<p class="err">'+esc(m)+'</p>':""}).then(function(){$("go-outfits").disabled=false;$("stop-outfits").hidden=true});
}
function checkDeal(){
  var text=$("listing").value.trim(),file=$("shot").files&&$("shot").files[0];
  if(!text&&!file){$("out-check").innerHTML='<p class="err">Paste a listing or add a screenshot first.</p>';return}
  chkCtl=new AbortController();
  $("go-check").disabled=true;$("stop-check").hidden=false;
  $("out-check").innerHTML='<p class="thinking">Thinking...</p>';
  (file?readImage(file):Promise.resolve("")).then(function(image){
    return api("/api/ai",{method:"POST",signal:chkCtl.signal,body:{task:"deal",today:today(),listing:text,image:image}});
  }).then(showVerdict).catch(function(e){var m=errCopy(e);$("out-check").innerHTML=m?'<p class="err">'+esc(m)+'</p>':""}).then(function(){$("go-check").disabled=false;$("stop-check").hidden=true});
}
function showVerdict(r){
  if(!r||typeof r!=="object"){$("out-check").innerHTML='<p class="err">The reply could not be read. Try again.</p>';return}
  var v=r.verdict==="buy"?["approved","Buy"]:r.verdict==="skip"?["passed","Skip"]:["try","Try first"];
  var html='<div class="cards"><div class="card"><div class="verdict"><span class="pill '+v[0]+'">'+v[1]+'</span><span class="big">'+esc(r.headline||"")+'</span></div>';
  if((r.reasons||[]).length)html+='<ul>'+r.reasons.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul>';
  html+='</div>';
  if(r.size||r.price)html+='<div class="card"><h3>Size and price</h3>'+(r.size?'<span>'+esc(r.size)+'</span>':'')+(r.price?'<span>'+esc(r.price)+'</span>':'')+'</div>';
  var outs=(r.outfits||[]).map(function(o){return {title:o.title,names:(o.pieceIds||[]).map(itemName).filter(Boolean)}}).filter(function(o){return o.names.length});
  var n=Number(r.outfitCount);
  html+='<div class="card"><h3>'+(isFinite(n)?'Works with '+n+(n===1?' outfit':' outfits')+' you own':'With your closet')+'</h3>'+
    (outs.length?outs.map(function(o){return '<div><span class="mono">'+esc(o.title||"Outfit")+'</span><ul>'+o.names.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ul></div>'}).join(""):'<span class="note">No strong pairings found.</span>')+'</div>';
  html+='<div class="actions"><button class="btn ghost" id="save-from-check" type="button">Add to my log</button></div></div>';
  $("out-check").innerHTML=html;
  $("save-from-check").onclick=function(){
    var cat=CATS.indexOf(r.category)>-1?r.category:"";
    openSheet(null,{name:r.suggestName||r.matchedStyle||"",brand:r.brand||"",cat:cat,status:r.verdict==="buy"?"approved":"try",note:""});
  };
}

function fillFromListing(){
  var t=$("fill-text").value.trim();
  if(!t&&!state.fillShot){$("fill-msg").textContent="Paste a link, listing text or add a screenshot first.";return}
  var m=/https?:\/\/\S+/.exec(t),url=m?m[0]:"",rest=m?t.replace(url,"").trim():t;
  $("fill-msg").textContent=url?"Reading the page...":"Reading...";$("fill-go").disabled=true;
  api("/api/ai",{method:"POST",body:{task:"fill",url:url,text:rest,image:state.fillShot}}).then(function(r){
    function setIf(id,v){if(v&&!$(id).value.trim())$(id).value=v}
    setIf("f-name",r.name);setIf("f-brand",r.brand);
    if(CATS.indexOf(r.category)>-1&&!$("f-cat").value)$("f-cat").value=r.category;
    if((r.colors||[]).length)setIf("f-colors",r.colors.join(", "));if((r.subs||[]).length)setIf("f-subs",r.subs.join(", "));
    setIf("f-fabric",r.fabric);setIf("f-size",r.size);setIf("f-look",r.look);
    var it=state.editing&&itemById(state.editing);
    var hasPhoto=!!state.sheet.photo||(it&&it.photoV&&!state.sheet.removePhoto);
    if(r.photo&&!hasPhoto){
      return fetch(r.photo).then(function(x){return x.blob()}).then(pickPhoto).then(function(){$("fill-msg").textContent="Filled, with the product photo. Check the fields."});
    }
    $("fill-msg").textContent="Filled. Check the fields.";
  }).catch(function(e){$("fill-msg").textContent=errCopy(e)||""}).then(function(){$("fill-go").disabled=false});
}

$("p-paste").onclick=function(){
  var err=$("sheet-err");err.textContent="";
  if(!navigator.clipboard||!navigator.clipboard.read){err.textContent="Pasting images is not supported here. Save the image to Photos and use Add photo.";return}
  navigator.clipboard.read().then(function(list){
    for(var i=0;i<list.length;i++){
      var ty=list[i].types.filter(function(x){return x.indexOf("image/")===0})[0];
      if(ty)return list[i].getType(ty).then(pickPhoto);
    }
    err.textContent="No image on the clipboard. Copy an image first.";
  }).catch(function(){err.textContent="Clipboard access was blocked. Allow paste when asked, or use Add photo."});
};

};

};
$("dock-log").onclick=startSelect;$("sel-cancel").onclick=endSelect;$("sel-save").onclick=saveSelect;
$("log-bulk").onclick=function(){openPicker("bulk")};
$("w-q").oninput=renderPicker;
$("sheet2").onsubmit=savePicker;$("w-cancel").onclick=function(){$("sheet2-back").hidden=true};

updateDock();
render();
start();
})();
